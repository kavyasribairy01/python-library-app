version: "3"

services:

  db:
    image: kavyasribairy/pyapp:database_image
    ports:
      - "3306:3306"
    networks:
      - mynet

  auth:
    image: kavyasribairy/pyapp:auth_image
    ports:
      - "5001:5001"
    networks:
      - mynet

  books:
    image: kavyasribairy/pyapp:book_image
    ports:
      - "5002:5002"
    networks:
      - mynet

  borrow:
    image: kavyasribairy/pyapp:borrow_image
    ports:
      - "5003:5003"
    networks:
      - mynet

  frontend:
    image: kavyasribairy/pyapp:frontend
    ports:
      - "5000:5000"
    networks:
      - mynet

networks:
  mynet:
    driver: overlay
